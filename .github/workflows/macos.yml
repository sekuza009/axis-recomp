# The macOS build checked on GitHub's own Macs - Apple Silicon (macos-15) and Intel (macos-15-intel): the 64-bit library
# built there (standalone/build64.sh, zig), the POSIX platform's tests, the x87 replacements of the arm64 build against
# the x87's results, and the library loaded with dlopen and made ready (no game files here: the game is not started).
name: macOS
on:
  push:
    branches: [portable, godot]
    paths: ['src/**', 'standalone/**', 'tools/**', 'third_party/**', 'recomp.c', 'axisnet_dp.c', '.github/workflows/macos.yml']
  workflow_dispatch:
jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: zig
        run: python -m pip install ziglang==0.16.0
      - name: the library (macOS, ${{ matrix.arch }})
        run: bash standalone/build64.sh macos-${{ matrix.arch }}
      - name: the POSIX platform's tests
        run: bash tools/plat_tests/run_posix_native.sh
      - name: the x87 helpers against the x87's results
        run: |
          cc -O2 -o build/x87_test tools/plat_tests/x87_test.c
          build/x87_test tools/plat_tests/x87_expected.txt
      - name: the library loaded with dlopen
        run: |
          mkdir -p build/gamedir
          file build/libaxis64_${{ matrix.arch }}.dylib
          nm -gU build/libaxis64_${{ matrix.arch }}.dylib | grep ' _axis_'
          AXIS_TEST_LOAD_ONLY=1 AXIS_TEST_LIB=$PWD/build/libaxis64_${{ matrix.arch }}.dylib AXIS_USER_DIR=$PWD/build/userdir \
            build/axis64_test_macos_${{ matrix.arch }} $PWD/build/gamedir
          cat build/userdir/standalone64.log
