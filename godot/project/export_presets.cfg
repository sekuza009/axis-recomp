; The exported game (godot/export.sh): Windows, 32-bit (preset 0) or 64-bit (preset 1), the data in AxisGodot.pck beside the exe; axis.dll is copied
; beside it by export.sh (the host loads it with LoadLibrary, so it cannot live in the pack).
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="bin/*.pdb, bin/*.lib, bin/axis.dll, bin/axis64.dll"
export_path="../../build/godot_export/AxisGodot.exe"
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_32"
binary_format/embed_pck=false
application/modify_resources=false
application/export_console_wrapper=0
application/product_name="Axis"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]

name="Windows Desktop 64-bit"
platform="Windows Desktop"
runnable=true
